[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linktwin"
version = "0.1.0"
description = "Digital twin of a drifting entanglement-distribution link with adaptive monitoring and distillation-policy selection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Degala Chenchupradeep" }]
dependencies = ["numpy>=2.0", "pandas>=2.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
